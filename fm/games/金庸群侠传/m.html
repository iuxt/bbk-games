<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">
    <meta name="theme-color" content="#dfe3d1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="description" content="RPG · 步步高电子词典经典游戏">
    <title>RPG · BBK 经典游戏</title>
    <link rel="icon" href="../../../favicon.png">
    <link rel="stylesheet" href="../../../css/portal.css">
    <style>
        /* 游戏画面：160×96 横向矩形，宽度自适应、像素锐利 */
        #lcd {
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }

        /* 虚拟按键：沿用魔塔 m.html 的 #touchpad 风格 */
        #touchpad {
            margin-top: 14px;
        }
        #touchpad .kb-row {
            display: flex;
            gap: 8px;
        }
        #touchpad .kb-row + .kb-row { margin-top: 8px; }
        #touchpad .btn {
            flex: 1;
            height: 52px;
            border: 0;
            border-radius: 8px;
            color: #eef0e7;
            background: var(--key);
            box-shadow: inset 0 -4px 0 var(--key-edge);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            -webkit-appearance: none;
            touch-action: manipulation;
            user-select: none;
        }
        #touchpad .btn:active { transform: translateY(2px); }
        #touchpad .btn.enter {
            background: var(--accent);
            box-shadow: inset 0 -4px 0 #7d3a2f;
        }
    </style>
    <script src="../../js/jquery.min.js"></script>
    <script src="../../js/encoding-indexes.js"></script>
    <script src="../../js/encoding.js"></script>
    <script src="../../js/sys.js"></script>
    <script src="../../js/kotlin.js"></script>
    <script src="../../js/keyboard.js"></script>
    <script src="../../js/font.js"></script>
    <script src="rom.js"></script>
</head>
<body>
    <main class="device-shell utility-shell">
        <header class="device-header">
            <a class="brand" href="../../../index.html" aria-label="返回 BBK 经典游戏首页">
                <span class="brand-mark">BBK</span>
                <span>经典游戏</span>
            </a>
            <span class="power-light" aria-hidden="true"></span>
        </header>

        <div class="section-heading game-title">
            <h1 id="game-title">RPG</h1>
            <span>RPG · 160×96</span>
        </div>

        <section class="lcd-panel lcd-panel-screen" aria-label="RPG 游戏画面">
            <canvas id="lcd" width="160" height="96">你的浏览器不支持 HTML5</canvas>
        </section>

        <div id="touchpad">
            <div class="kb-row">
                <button class="btn" type="button" data-key="5">PgUp</button>
                <button class="btn" type="button" data-key="1">↑</button>
                <button class="btn" type="button" data-key="6">PgDn</button>
            </div>
            <div class="kb-row">
                <button class="btn" type="button" data-key="3">←</button>
                <button class="btn" type="button" data-key="2">↓</button>
                <button class="btn" type="button" data-key="4">→</button>
            </div>
            <div class="kb-row">
                <button class="btn" type="button" data-key="8">取消</button>
                <button class="btn enter" type="button" data-key="7">确认</button>
            </div>
        </div>

        <footer class="device-footer utility-footer">
            <span>GAME 04 · RPG</span>
            <a class="footer-link" href="../../index.html">‹ 返回</a>
        </footer>
    </main>

    <script src="../../js/fmj.core.js"></script>
    <script>
        // 从页面路径推导游戏名（/fm/games/伏魔记/m.html → 伏魔记）作为标题
        (function () {
            var m = location.pathname.match(/\/games\/([^\/]+)\//);
            var name = "RPG";
            if (m) { try { name = decodeURIComponent(m[1]); } catch (e) { name = m[1]; } }
            $("#game-title").text(name);
            document.title = name + " · BBK 经典游戏";
        })();

        // 虚拟按键：方向键（↑↓←→）支持长按连续触发，PgUp/PgDn/确认/取消为单次
        var HOLD_KEYS = { 1: 1, 2: 1, 3: 1, 4: 1 };

        $("#touchpad .btn").each(function () {
            var key = Number($(this).data("key"));
            var iv = null;
            $(this).on("touchstart mousedown", function (e) {
                e.preventDefault();
                onKeyDown(key);
                if (HOLD_KEYS[key]) {
                    iv = setInterval(function () { onKeyDown(key); }, 450);
                }
            });
            $(this).on("touchend touchcancel mouseup mouseleave", function () {
                if (iv) { clearInterval(iv); iv = null; }
            });
        });

        // 物理键盘仍可用
        document.onkeydown = onKeyDown;
    </script>
</body>
</html>
