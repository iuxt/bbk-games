<!doctype html>
<html lang="zh-CN" class="gameplay-page">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#dfe3d1">
    <meta name="description" content="赤壁之战之谁与争锋 · 步步高电子词典经典 RPG">
    <title>赤壁之战之谁与争锋 · BBK 经典游戏</title>
    <link rel="icon" href="../../../favicon.png">
    <link rel="stylesheet" href="../../../css/portal.css?v=2">
    <script src="../../../js/game-page.js?v=1"></script>
    <script src="../../js/jquery.min.js"></script>
    <script src="../../js/encoding-indexes.js"></script>
    <script src="../../js/encoding.js"></script>
    <script src="../../js/sys.js"></script>
    <script src="../../js/kotlin.js"></script>
    <script src="../../js/font.js"></script>
    <script src="rom.js"></script>
</head>
<body>
    <main class="device-shell utility-shell">
        <header class="device-header">
            <a class="brand" href="../../index.html" aria-label="返回 RPG 游戏列表">
                <span class="brand-mark">BBK</span>
                <span>经典游戏</span>
            </a>
            <span class="power-light" aria-hidden="true"></span>
        </header>

        <div class="section-heading game-title">
            <h1>赤壁之战之谁与争锋</h1>
            <span>FMJ · 160×96</span>
        </div>

        <section class="lcd-panel lcd-panel-screen" aria-label="赤壁之战之谁与争锋游戏画面">
            <canvas id="lcd" width="160" height="96">你的浏览器不支持 HTML5 Canvas</canvas>
        </section>

        <section class="game-section" aria-labelledby="keys-title">
            <div class="section-heading">
                <h2 id="keys-title">按键映射</h2>
                <span>KEYBOARD</span>
            </div>
            <div class="key-map">
                <div class="key-map-item">
                    <span class="key-chip">↑ ↓ ← →</span>
                    <span>移动 / 选择</span>
                </div>
                <div class="key-map-item">
                    <span class="key-chip">Enter</span>
                    <span>确认 / 输入</span>
                </div>
                <div class="key-map-item">
                    <span class="key-chip">Space / Esc</span>
                    <span>取消 / 返回</span>
                </div>
                <div class="key-map-item">
                    <span class="key-chip">[ ]</span>
                    <span>翻页</span>
                </div>
            </div>
        </section>

        <footer class="device-footer utility-footer">
            <span>GAME 04 · RPG</span>
            <a class="footer-link" href="../../index.html">‹ 返回游戏列表</a>
        </footer>
    </main>
    <script src="../../js/fmj.core.js"></script>
</body>
</html>
