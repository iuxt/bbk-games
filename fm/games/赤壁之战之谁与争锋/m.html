<!doctype html>
<html lang="zh-CN" class="gameplay-page">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">
    <meta name="theme-color" content="#dfe3d1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="description" content="赤壁之战之谁与争锋 · 步步高电子词典经典 RPG">
    <title>赤壁之战之谁与争锋 · BBK 经典游戏</title>
    <link rel="icon" href="../../../favicon.png">
    <link rel="stylesheet" href="../../../css/portal.css?v=2">
    <script src="../../../js/game-page.js?v=1"></script>
    <style>
        #lcd {
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }

        #touchpad {
            margin-top: 14px;
        }
        #touchpad .kb-row {
            display: flex;
            gap: 8px;
        }
        #touchpad .kb-row + .kb-row { margin-top: 8px; }
        #touchpad .btn {
            flex: 1;
            height: 52px;
            border: 0;
            border-radius: 8px;
            color: #eef0e7;
            background: var(--key);
            box-shadow: inset 0 -4px 0 var(--key-edge);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            -webkit-appearance: none;
            touch-action: manipulation;
            user-select: none;
        }
        #touchpad .btn:active { transform: translateY(2px); }
        #touchpad .btn.enter {
            background: var(--accent);
            box-shadow: inset 0 -4px 0 #7d3a2f;
        }
    </style>
    <script src="../../js/jquery.min.js"></script>
    <script src="../../js/encoding-indexes.js"></script>
    <script src="../../js/encoding.js"></script>
    <script src="../../js/sys.js"></script>
    <script src="../../js/kotlin.js"></script>
    <script src="../../js/keyboard.js"></script>
    <script src="../../js/font.js"></script>
    <script src="rom.js"></script>
</head>
<body>
    <main class="device-shell utility-shell">
        <header class="device-header">
            <a class="brand" href="../../../index.html" aria-label="返回 BBK 经典游戏首页">
                <span class="brand-mark">BBK</span>
                <span>经典游戏</span>
            </a>
            <span class="power-light" aria-hidden="true"></span>
        </header>

        <div class="section-heading game-title">
            <h1>赤壁之战之谁与争锋</h1>
            <span>RPG · 160×96</span>
        </div>

        <section class="lcd-panel lcd-panel-screen" aria-label="赤壁之战之谁与争锋游戏画面">
            <canvas id="lcd" width="160" height="96">你的浏览器不支持 HTML5</canvas>
        </section>

        <div id="touchpad">
            <div class="kb-row">
                <button class="btn" type="button" data-key="5">PgUp</button>
                <button class="btn" type="button" data-key="1">↑</button>
                <button class="btn" type="button" data-key="6">PgDn</button>
            </div>
            <div class="kb-row">
                <button class="btn" type="button" data-key="3">←</button>
                <button class="btn" type="button" data-key="2">↓</button>
                <button class="btn" type="button" data-key="4">→</button>
            </div>
            <div class="kb-row">
                <button class="btn" type="button" data-key="8">取消</button>
                <button class="btn enter" type="button" data-key="7">确认</button>
            </div>
        </div>

        <footer class="device-footer utility-footer">
            <span>GAME 04 · RPG</span>
            <a class="footer-link" href="../../index.html">‹ 返回</a>
        </footer>
    </main>

    <script src="../../js/fmj.core.js"></script>
    <script>
        var HOLD_KEYS = { 1: true, 2: true, 3: true, 4: true };

        $("#touchpad .btn").each(function () {
            var button = this;
            var key = Number($(button).data("key"));
            var repeatTimer = null;

            function stopRepeat() {
                if (repeatTimer !== null) {
                    clearInterval(repeatTimer);
                    repeatTimer = null;
                }
            }

            $(button).on("pointerdown", function (event) {
                event.preventDefault();
                stopRepeat();
                onKeyDown(key);
                if (button.setPointerCapture) {
                    try {
                        button.setPointerCapture(event.pointerId);
                    } catch (error) {
                        // 合成事件或旧浏览器可能没有可捕获的活动指针，继续处理单次按键
                    }
                }
                if (HOLD_KEYS[key]) {
                    repeatTimer = setInterval(function () { onKeyDown(key); }, 450);
                }
            });
            $(button).on("pointerup pointercancel lostpointercapture", stopRepeat);
            $(button).on("click", function (event) {
                // 键盘触发的按钮 click 没有指针坐标，保留无障碍操作。
                if (event.detail === 0) onKeyDown(key);
            });
        });

        document.onkeydown = onKeyDown;
    </script>
</body>
</html>
