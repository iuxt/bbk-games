<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#dfe3d1">
    <meta name="description" content="备份或还原游戏存档文件">
    <title>备份 / 还原 · BBK 经典游戏</title>
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="css/portal.css">

    <script src="js/jquery.min.js"></script>
    <script src="js/lcd.js?ver=13"></script>
    <script src="js/backup.js?ver=3"></script>
    <script>
        // 通用存档备份 / 还原：按 ?game= 选择 profile 组（baye / fmj），
        // baye 组显示版本选择器、fmj 组显示游戏选择器，切换即切换存档空间
        $(function () {
            var B = window.BBKBackup;

            // baye 默认选中当前游戏启动版本；fmj 默认第一个游戏；其余按字面 id 解析
            function resolveProfile(p) {
                if (p === "fmj") return B.getProfile("fmj/" + B.FMJ_GAMES[0]);
                if (p === "baye") {
                    var curLibId = (typeof getLibId === "function") ? getLibId() : "";
                    return B.getProfile("baye/" + curLibId) ||
                           B.getProfile("baye/" + B.BAYE_LIBS[0].id);
                }
                return B.getProfile(p);
            }

            var param = new URLSearchParams(location.search).get("game") || "baye";
            var profile = resolveProfile(param) || B.getProfile("baye/" + B.BAYE_LIBS[0].id);

            // 门户编号（页眉 / 页脚显示用）
            var PORTAL_NO = { baye: "GAME 01", fmj: "GAME 04" };
            var portalNo = PORTAL_NO[profile.group] || "GAME";

            var storage = window.localStorage;
            function readKey(k) { return storage.getItem(k); }
            function safeSet(k, v) {
                try { storage.setItem(k, v); return true; }
                catch (e) { return false; }
            }

            function todayStamp() {
                var d = new Date();
                function pad(x) { return (x < 10 ? "0" : "") + x; }
                return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
            }

            // 版本/游戏显示名
            function targetLabel() {
                if (profile.group === "baye") {
                    return "当前版本：" + profile.name + "（存档按版本独立）";
                }
                if (profile.group === "fmj") {
                    return "当前游戏：" + profile.name + "（存档按游戏独立）";
                }
                return null;
            }

            function showResult(title, help, kind) {
                $("#result-title").text(title);
                $("#result-help").text(help);
                $("#result").removeClass("is-warn").addClass(kind === "warn" ? "is-warn" : "");
            }

            // 导出存档槽 n 为 .sav 文件
            function exportSlot(slot) {
                var payload = B.buildExportPayload(profile, slot, readKey);
                if (!payload) {
                    showResult("存档 " + (slot + 1) + " 是空的",
                               "请先在游戏中存档，再回来备份。", "warn");
                    return;
                }

                var blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
                var url = URL.createObjectURL(blob);
                var a = document.createElement("a");
                a.href = url;
                a.download = B.fileName(profile, slot, todayStamp());
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);

                showResult("已导出存档 " + (slot + 1),
                           "文件名 " + a.download + "。请妥善保存，可用于日后还原。", "ok");
            }

            // 还原：文件选择 → 解析
            var pendingRestore = null;
            var targetSlot = 0;

            function onFilePicked(input) {
                var file = input.files && input.files[0];
                if (!file) return;

                var reader = new FileReader();
                reader.onload = function () {
                    var data;
                    try {
                        data = JSON.parse(reader.result);
                    } catch (e) {
                        rejectFile(file.name, "文件格式无效", "无法解析存档文件，请确认是本站导出的 .sav 文件。");
                        return;
                    }

                    var parsed = B.parseBackup(data);
                    if (!parsed) {
                        rejectFile(file.name, "存档格式错误", "这不是有效的 " + profile.name + " 存档备份。");
                        return;
                    }
                    if (!B.canRestore(parsed, profile)) {
                        var src = B.getProfile(parsed.profileId);
                        var srcName = src ? src.name
                            : (parsed.profileId === B.LEGACY_BAYE_ID ? "旧版三国霸业" : parsed.profileId);
                        rejectFile(file.name, "存档版本不匹配",
                                   "该备份属于「" + srcName +
                                   "」，与当前「" + profile.name + "」不符。请先切换到对应版本再还原。");
                        return;
                    }

                    pendingRestore = parsed;
                    $("#restore-file-name").text(file.name);

                    // 默认目标槽 = 文件来源槽
                    targetSlot = (typeof parsed.slot === "number") ? parsed.slot : 0;
                    if (targetSlot >= profile.slots) targetSlot = 0;
                    syncSlotPicker();
                    $("#restore-btn").prop("disabled", false);

                    var fromSlot = (typeof parsed.slot === "number") ? (parsed.slot + 1) : "?";
                    var help = "来源：存档 " + fromSlot + "。选择目标槽后点「还原存档」。";
                    if (parsed.profileId === B.LEGACY_BAYE_ID) {
                        help = "旧版备份未标注版本，将还原到当前「" + profile.name + "」，请确认版本正确。" + help;
                    } else if (parsed.profileId === B.LEGACY_FMJ_ID) {
                        help = "旧版备份未标注游戏，请确认当前选择的是正确的游戏。" + help;
                    }
                    showResult("已读取存档文件", help, "info");
                };
                reader.readAsText(file);
            }

            function rejectFile(name, title, help) {
                pendingRestore = null;
                $("#restore-btn").prop("disabled", true);
                $("#restore-file-name").text(name);
                showResult(title, help, "warn");
            }

            function pickSlot(n) {
                targetSlot = n;
                syncSlotPicker();
            }

            // 仅同步目标槽选择器，避免误清版本 / 游戏选择器（同样带 slot-chip 类）的高亮
            function syncSlotPicker() {
                $("#slot-picker .slot-chip").each(function () {
                    var active = (Number($(this).data("slot")) === targetSlot);
                    $(this).attr("aria-checked", active ? "true" : "false");
                    $(this).toggleClass("is-active", active);
                });
            }

            function doRestore() {
                if (!pendingRestore) return;
                var parsed = pendingRestore;

                var ok = B.applyRestore(profile, targetSlot, parsed.files, parsed.version, safeSet);
                if (!ok) {
                    showResult("存档写入失败",
                               "浏览器存储不可用（可能配额已满）。还原中止。", "warn");
                    return;
                }

                var note;
                if (parsed.profileId === B.LEGACY_BAYE_ID) {
                    note = "旧版备份未标注版本，已写入当前「" + profile.name + "」存档 " + (targetSlot + 1) + "。";
                } else {
                    note = "已写入「" + profile.name + "」存档 " + (targetSlot + 1) + "。";
                }
                note += "进入对应版本游戏后载入该存档即可。";
                showResult("还原成功", note, "ok");
            }

            // 按 profile 动态渲染导出按钮
            function renderExport() {
                var $grid = $("#export-grid").empty();
                for (var n = 0; n < profile.slots; n++) {
                    (function (slot) {
                        var key = ("0" + (slot + 1)).slice(-2);
                        $("<button class=\"game-card game-link save-action\" type=\"button\"></button>")
                            .append('<span class="game-key" aria-hidden="true">' + key + "</span>")
                            .append('<span class="game-copy"><strong>导出存档 ' + (slot + 1) +
                                    '</strong><small>下载为 .sav 文件</small></span>')
                            .append('<span class="game-arrow" aria-hidden="true">›</span>')
                            .on("click", function () { exportSlot(slot); })
                            .appendTo($grid);
                    })(n);
                }
                $("#export-slot-count").text(profile.slots + " SLOTS");
            }

            // 按 profile 动态渲染目标槽选择器
            function renderSlotPicker() {
                var $picker = $("#slot-picker").empty();
                for (var n = 0; n < profile.slots; n++) {
                    (function (slot) {
                        $("<button type=\"button\" class=\"slot-chip\" data-slot=\"" + slot + "\">存档 " +
                          (slot + 1) + "</button>")
                            .attr("aria-checked", slot === targetSlot ? "true" : "false")
                            .toggleClass("is-active", slot === targetSlot)
                            .on("click", function () { pickSlot(slot); })
                            .appendTo($picker);
                    })(n);
                }
            }

            // 切换 profile（baye 版本 / fmj 游戏），即切换存档空间
            function pickProfile(id) {
                var next = B.getProfile(id);
                if (!next || next.id === profile.id) return;
                profile = next;
                pendingRestore = null;
                targetSlot = 0;
                $("#restore-btn").prop("disabled", true);
                $("#restore-file-name").text("点击选取 .sav 备份文件");
                render();
            }

            function renderGamePicker() {
                var $picker = $("#game-picker").empty();
                for (var n = 0; n < B.FMJ_GAMES.length; n++) {
                    (function (game) {
                        var id = "fmj/" + game;
                        $("<button type=\"button\" class=\"slot-chip game-chip\" data-game-id=\"" + id +
                          "\">" + game + "</button>")
                            .attr("aria-checked", id === profile.id ? "true" : "false")
                            .toggleClass("is-active", id === profile.id)
                            .on("click", function () { pickProfile(id); })
                            .appendTo($picker);
                    })(B.FMJ_GAMES[n]);
                }
            }

            // baye 组：渲染版本选择器，切换版本即切换存档空间（不改游戏启动版本）
            function renderVersionPicker() {
                var $picker = $("#game-picker").empty();
                for (var n = 0; n < B.BAYE_LIBS.length; n++) {
                    (function (lib) {
                        var id = "baye/" + lib.id;
                        $("<button type=\"button\" class=\"slot-chip game-chip\" data-game-id=\"" + id +
                          "\">" + lib.name + "</button>")
                            .attr("aria-checked", id === profile.id ? "true" : "false")
                            .toggleClass("is-active", id === profile.id)
                            .on("click", function () { pickProfile(id); })
                            .appendTo($picker);
                    })(B.BAYE_LIBS[n]);
                }
            }

            function render() {
                document.title = "备份 / 还原 · " + profile.name;
                $("#page-game-name").text(profile.name);
                var label = targetLabel();
                if (label) {
                    $("#lib-name").text(label).show();
                } else {
                    $("#lib-name").hide();
                }
                if (profile.group === "fmj") {
                    $("#game-picker-title").text("选择游戏");
                    $("#game-section .section-heading span").text("GAMES");
                    $("#game-section").show();
                    renderGamePicker();
                } else if (profile.group === "baye") {
                    $("#game-picker-title").text("选择版本");
                    $("#game-section .section-heading span").text("VERSIONS");
                    $("#game-section").show();
                    renderVersionPicker();
                } else {
                    $("#game-section").hide();
                }
                renderExport();
                renderSlotPicker();
                window.__profile = profile;
            }

            // 初始化页面文案
            $(".lcd-kicker").text(portalNo + " / BACKUP & RESTORE");
            $("#portal-no-footer").text(portalNo);
            render();

            // 暴露给测试与内联事件
            window.exportSlot = exportSlot;
            window.onFilePicked = onFilePicked;
            window.pickSlot = pickSlot;
            window.pickProfile = pickProfile;
            window.doRestore = doRestore;
        });
    </script>
</head>
<body>
    <main class="device-shell utility-shell">
        <header class="device-header">
            <a class="brand" href="index.html" aria-label="返回 BBK 经典游戏首页">
                <span class="brand-mark">BBK</span>
                <span>经典游戏</span>
            </a>
            <span class="power-light" aria-hidden="true"></span>
        </header>

        <section class="lcd-panel" id="result" aria-labelledby="page-title" aria-live="polite" aria-atomic="true">
            <p class="lcd-kicker">BACKUP &amp; RESTORE</p>
            <h1 id="page-title">备份 / 还原<span aria-hidden="true">_</span></h1>
            <p id="lib-name" class="lcd-version">当前版本：—</p>
            <h2 id="result-title" class="lcd-result-title">等待操作</h2>
            <p id="result-help" class="lcd-result-help"><span id="page-game-name">游戏</span> · 导出存档槽为文件备份，或上传文件还原</p>
        </section>

        <section class="game-section" id="game-section" aria-labelledby="game-picker-title" hidden>
            <div class="section-heading">
                <h2 id="game-picker-title">选择游戏</h2>
                <span>GAMES</span>
            </div>
            <div class="slot-picker" id="game-picker" role="radiogroup" aria-label="目标游戏"></div>
        </section>

        <section class="game-section" aria-labelledby="backup-title">
            <div class="section-heading">
                <h2 id="backup-title">备份存档</h2>
                <span id="export-slot-count">3 SLOTS</span>
            </div>
            <div class="save-grid" id="export-grid"></div>
        </section>

        <section class="game-section" aria-labelledby="restore-title">
            <div class="section-heading">
                <h2 id="restore-title">还原存档</h2>
                <span>UPLOAD</span>
            </div>

            <label class="game-card game-link save-action upload-card">
                <span class="game-key" aria-hidden="true">↑</span>
                <span class="game-copy">
                    <strong>选择存档文件</strong>
                    <small id="restore-file-name">点击选取 .sav 备份文件</small>
                </span>
                <span class="game-arrow" aria-hidden="true">›</span>
                <input type="file" accept=".sav,.json,application/json" id="restore-file" hidden
                       onclick="this.value=null" onchange="onFilePicked(this)">
            </label>

            <p class="slot-label">还原到目标槽</p>
            <div class="slot-picker" id="slot-picker" role="radiogroup" aria-label="目标存档槽"></div>

            <button type="button" class="restore-btn" id="restore-btn" disabled
                    onclick="doRestore()">还原存档</button>
        </section>

        <footer class="device-footer utility-footer">
            <span id="portal-no-footer">GAME</span>
            <a class="footer-link" href="index.html">‹ 返回游戏中心</a>
        </footer>
    </main>

    <noscript>
        <p class="noscript-note">备份/还原需要 JavaScript 才能读写存档文件。<a href="index.html">返回游戏中心</a></p>
    </noscript>
</body>
</html>
