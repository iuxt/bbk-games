<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">
    <meta name="theme-color" content="#dfe3d1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="description" content="三国霸业 · 步步高电子词典经典游戏">
    <title>三国霸业 · BBK 经典游戏</title>
    <link rel="icon" href="../favicon.png">
    <link rel="stylesheet" href="../css/portal.css">
    <script src="../js/game-page.js?v=1"></script>
    <style>
        /* 虚拟按键 - 与魔塔 / RPG 页面同款 */
        #touchpad {
            margin-top: 14px;
        }
        #touchpad .kb-row {
            display: flex;
            gap: 8px;
        }
        #touchpad .kb-row + .kb-row { margin-top: 8px; }
        #touchpad .btn {
            flex: 1;
            height: 52px;
            border: 0;
            border-radius: 8px;
            color: #eef0e7;
            background: var(--key);
            box-shadow: inset 0 -4px 0 var(--key-edge);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            -webkit-appearance: none;
            touch-action: manipulation;
        }
        #touchpad .btn:active { transform: translateY(2px); }
        #touchpad .btn.enter {
            background: var(--accent);
            box-shadow: inset 0 -4px 0 #7d3a2f;
        }
    </style>
    <script src="../js/jquery.min.js"></script>
    <script src="../js/encoding-indexes.js"></script>
    <script src="../js/encoding.js"></script>
    <script src="../js/sprintf.js"></script>
    <script>
        window.bayeDebugMode = window.location.href.match(/(localhost|debug=1)/);
        // 防止用户长时间后从历史记录直接恢复游戏页；开发环境和带有效时间戳的入口除外
        (function () {
            if (!window.bayeDebugMode) {
                var match = window.location.hash.match(/#([0-9]*)/i);
                if (match) {
                    var ts = parseInt(match[1], 10);
                    var now = new Date().getTime() / 1000;
                    var dt = now - ts;
                    if (ts && 0 <= dt && dt < 3600) {
                        return;
                    }
                }
                window.location.href = "../index.html";
            }
        })();
    </script>
</head>
<body>
    <main class="device-shell utility-shell">
        <header class="device-header">
            <a class="brand" href="../index.html" aria-label="返回 BBK 经典游戏首页">
                <span class="brand-mark">BBK</span>
                <span>经典游戏</span>
            </a>
            <span class="power-light" aria-hidden="true"></span>
        </header>

        <div class="section-heading game-title">
            <h1>三国霸业</h1>
            <span>BAYE · 160×96</span>
        </div>

        <section class="lcd-panel lcd-panel-screen" aria-label="三国霸业游戏画面">
            <canvas id="lcd" width="160" height="96">然而你的浏览器并不支持HTML5</canvas>
        </section>
        <p id="game-load-error" class="game-load-error" role="alert" hidden></p>

        <div id="touchpad">
            <div class="kb-row">
                <button class="btn" type="button" data-key="help">帮助</button>
                <button class="btn" type="button" data-key="up">↑</button>
                <button class="btn" type="button" data-key="search">查找</button>
            </div>
            <div class="kb-row">
                <button class="btn" type="button" data-key="left">←</button>
                <button class="btn" type="button" data-key="down">↓</button>
                <button class="btn" type="button" data-key="right">→</button>
            </div>
            <div class="kb-row">
                <button class="btn" type="button" data-key="exit">返回</button>
                <button class="btn enter" type="button" data-key="enter">输入</button>
            </div>
        </div>

        <footer class="device-footer utility-footer">
            <span>GAME 01 · BAYE</span>
            <a class="footer-link" href="../index.html">‹ 返回游戏中心</a>
        </footer>
    </main>
    <script src="../js/tappy.js"></script>
    <script src="js/bridge.js?ver=201801201234"></script>
    <script src="../js/lcd.js?ver=16"></script>
    <script src="js/baye.js?ver=201801201234"></script>
    <script>
        window.bayeExitToHome = false;
        lcdInit();

        var virtualKeys = {
            help: VK_HELP,
            up: VK_UP,
            search: VK_SEARCH,
            left: VK_LEFT,
            down: VK_DOWN,
            right: VK_RIGHT,
            exit: VK_EXIT,
            enter: VK_ENTER
        };
        $(".btn[data-key]").each(function () {
            var key = virtualKeys[$(this).attr("data-key")];
            $(this).bind("tap", function () { sendKey(key); });
        });

        document.onkeydown = onKeyDown;
        bayeMain();
    </script>
</body>
</html>
