<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#dfe3d1">
    <meta name="description" content="备份或还原游戏存档文件">
    <title>备份 / 还原 · BBK 经典游戏</title>
    <link rel="icon" href="../favicon.png">
    <link rel="stylesheet" href="../css/portal.css">

    <script src="../js/jquery.min.js"></script>
    <script src="js/backup.js?ver=7"></script>
    <script>
        // 三国霸业三个版本各自拥有独立存档空间。
        $(function () {
            var B = window.BBKBackup;

            function resolveProfile() {
                var libPath = "";
                try {
                    libPath = window.localStorage.getItem("baye/libpath") || "";
                } catch (e) {}
                var currentLibId = B.libIdFromPath(libPath);
                return B.getProfile("baye/" + currentLibId) ||
                    B.getProfile("baye/" + B.BAYE_LIBS[0].id);
            }

            var profile = resolveProfile();
            var portalNo = "GAME 01";

            var storage = null;
            try { storage = window.localStorage; } catch (e) {}
            function readKey(k) {
                if (!storage) throw new Error("storage unavailable");
                return storage.getItem(k);
            }
            function safeSet(k, v) {
                try {
                    if (!storage) return false;
                    storage.setItem(k, v);
                    return true;
                }
                catch (e) { return false; }
            }
            function safeRemove(k) {
                try {
                    if (!storage) return false;
                    storage.removeItem(k);
                    return true;
                }
                catch (e) { return false; }
            }

            function todayStamp() {
                var d = new Date();
                function pad(x) { return (x < 10 ? "0" : "") + x; }
                return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
            }

            function targetLabel() {
                return "当前版本：" + profile.name + "（存档按版本独立）";
            }

            function showResult(title, help, kind) {
                $("#result-title").text(title);
                $("#result-help").text(help);
                $("#result").removeClass("is-warn").addClass(kind === "warn" ? "is-warn" : "");
            }

            // 导出存档槽 n 为 .json 文件
            function exportSlot(slot) {
                var payload;
                try {
                    payload = B.buildExportPayload(profile, slot, readKey);
                } catch (e) {
                    showResult("无法读取存档",
                               "浏览器存储不可用，请检查隐私模式或站点存储权限。", "warn");
                    return;
                }
                if (!payload) {
                    showResult("存档 " + (slot + 1) + " 是空的",
                               "请先在游戏中存档，再回来备份。", "warn");
                    return;
                }

                var blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
                var url = URL.createObjectURL(blob);
                var a = document.createElement("a");
                a.href = url;
                a.download = B.fileName(profile, slot, todayStamp());
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);

                showResult("已导出存档 " + (slot + 1),
                           "文件名 " + a.download + "。请妥善保存，可用于日后还原。", "ok");
            }

            // 还原按钮直接绑定槽位，选择文件后立即写入对应槽位。
            var restoreTargetSlot = null;

            function pickRestoreFile(slot) {
                restoreTargetSlot = slot;
                var input = document.getElementById("restore-file");
                input.value = "";
                input.click();
            }

            function onFilePicked(input) {
                var file = input.files && input.files[0];
                var targetSlot = restoreTargetSlot;
                if (!file || targetSlot === null) return;

                var reader = new FileReader();
                reader.onload = function () {
                    var data;
                    try {
                        data = JSON.parse(reader.result);
                    } catch (e) {
                        rejectFile("文件格式无效", "无法解析存档文件，请确认是本站导出的 .json 文件。");
                        return;
                    }

                    var parsed = B.parseBackup(data);
                    if (!parsed) {
                        rejectFile("存档格式错误", "这不是有效的 " + profile.name + " 存档备份。");
                        return;
                    }
                    if (!B.canRestore(parsed, profile)) {
                        var src = B.getProfile(parsed.profileId);
                        var srcName = src ? src.name : parsed.profileId;
                        rejectFile("存档版本不匹配",
                                   "该备份属于「" + srcName +
                                   "」，与当前「" + profile.name + "」不符。请先切换到对应版本再还原。");
                        return;
                    }

                    doRestore(parsed, targetSlot, file.name);
                };
                reader.readAsText(file);
            }

            function rejectFile(title, help) {
                restoreTargetSlot = null;
                showResult(title, help, "warn");
            }

            function doRestore(parsed, targetSlot, fileName) {
                var ok = B.applyRestore(
                    profile,
                    targetSlot,
                    parsed.files,
                    safeSet,
                    readKey,
                    safeRemove
                );
                if (!ok) {
                    showResult("存档写入失败",
                               "浏览器存储不可用（可能配额已满）。还原中止。", "warn");
                    restoreTargetSlot = null;
                    return;
                }

                showResult(
                    "存档 " + (targetSlot + 1) + " 还原成功",
                    "已从 " + fileName + " 写入「" + profile.name + "」。进入游戏后读取该存档即可。",
                    "ok"
                );
                restoreTargetSlot = null;
                renderSlots();
            }

            function slotPayload(slot) {
                try {
                    return B.buildExportPayload(profile, slot, readKey);
                } catch (e) {
                    return null;
                }
            }

            // 与电子词典模拟器一致：每个槽位是一张独立卡片，操作不再跨区跳转。
            function renderSlots() {
                var $grid = $("#save-slot-grid").empty();
                for (var n = 0; n < profile.slots; n++) {
                    (function (slot) {
                        var hasSave = !!slotPayload(slot);
                        var $card = $("<article class=\"backup-slot-card\"></article>")
                            .toggleClass("has-save", hasSave);
                        var $head = $("<div class=\"backup-slot-head\"></div>")
                            .append('<span class="backup-slot-number" aria-hidden="true">' +
                                    ("0" + (slot + 1)).slice(-2) + "</span>")
                            .append('<span class="backup-slot-copy"><strong>存档槽 ' +
                                    (slot + 1) + "</strong><small>" +
                                    (hasSave ? "已有存档" : "空档案") + "</small></span>");
                        var $actions = $("<div class=\"backup-slot-actions\"></div>");
                        $("<button type=\"button\" class=\"backup-slot-button\">备份</button>")
                            .prop("disabled", !hasSave)
                            .attr("aria-label", "备份存档槽 " + (slot + 1))
                            .on("click", function () { exportSlot(slot); })
                            .appendTo($actions);
                        $("<button type=\"button\" class=\"backup-slot-button is-primary\">还原</button>")
                            .attr("aria-label", "还原到存档槽 " + (slot + 1))
                            .on("click", function () { pickRestoreFile(slot); })
                            .appendTo($actions);
                        $card.append($head).append($actions).appendTo($grid);
                    })(n);
                }
            }

            // 切换版本即切换存档空间。
            function pickProfile(id) {
                var next = B.getProfile(id);
                if (!next || next.id === profile.id) return;
                profile = next;
                restoreTargetSlot = null;
                showResult("等待操作", profile.name + " · 选择槽位进行备份或还原", "info");
                render();
            }

            function moveVersionFocus(index) {
                var count = B.BAYE_LIBS.length;
                var nextIndex = (index + count) % count;
                var next = B.BAYE_LIBS[nextIndex];
                pickProfile("baye/" + next.id);
                $("#version-tab-" + next.id).trigger("focus");
            }

            // 切换这里只影响备份目标，不改变游戏启动版本。
            function renderVersionPicker() {
                var $picker = $("#version-tabs").empty();
                for (var n = 0; n < B.BAYE_LIBS.length; n++) {
                    (function (lib, tabIndex) {
                        var id = "baye/" + lib.id;
                        var active = id === profile.id;
                        $("<button type=\"button\" class=\"backup-version-tab\" role=\"tab\" data-game-id=\"" +
                          id + "\">" + lib.name + "</button>")
                            .attr("id", "version-tab-" + lib.id)
                            .attr("aria-selected", active ? "true" : "false")
                            .attr("tabindex", active ? "0" : "-1")
                            .toggleClass("is-active", id === profile.id)
                            .on("click", function () { pickProfile(id); })
                            .on("keydown", function (event) {
                                if (event.key === "ArrowLeft") {
                                    event.preventDefault();
                                    moveVersionFocus(tabIndex - 1);
                                } else if (event.key === "ArrowRight") {
                                    event.preventDefault();
                                    moveVersionFocus(tabIndex + 1);
                                } else if (event.key === "Home") {
                                    event.preventDefault();
                                    moveVersionFocus(0);
                                } else if (event.key === "End") {
                                    event.preventDefault();
                                    moveVersionFocus(B.BAYE_LIBS.length - 1);
                                }
                            })
                            .appendTo($picker);
                    })(B.BAYE_LIBS[n], n);
                }
            }

            function render() {
                document.title = "备份 / 还原 · " + profile.name;
                $("#page-game-name").text(profile.name);
                $("#lib-name").text(targetLabel()).show();
                renderVersionPicker();
                $("#save-panel").attr("aria-labelledby", "version-tab-" + profile.id.split("/")[1]);
                renderSlots();
            }

            // 初始化页面文案
            $(".lcd-kicker").text(portalNo + " / BACKUP & RESTORE");
            $("#portal-no-footer").text(portalNo);
            render();

            // 隐藏文件输入由每张槽位卡的「还原」按钮触发。
            window.onFilePicked = onFilePicked;
        });
    </script>
</head>
<body>
    <main class="device-shell utility-shell">
        <header class="device-header">
            <a class="brand" href="../index.html" aria-label="返回 BBK 经典游戏首页">
                <span class="brand-mark">BBK</span>
                <span>经典游戏</span>
            </a>
            <span class="power-light" aria-hidden="true"></span>
        </header>

        <section class="lcd-panel" id="result" aria-labelledby="page-title" aria-live="polite" aria-atomic="true">
            <p class="lcd-kicker">BACKUP &amp; RESTORE</p>
            <h1 id="page-title">备份 / 还原<span aria-hidden="true">_</span></h1>
            <p id="lib-name" class="lcd-version">当前版本：—</p>
            <h2 id="result-title" class="lcd-result-title">等待操作</h2>
            <p id="result-help" class="lcd-result-help"><span id="page-game-name">游戏</span> · 导出存档槽为文件备份，或上传文件还原</p>
        </section>

        <section class="game-section" aria-labelledby="version-picker-title">
            <div class="section-heading">
                <h2 id="version-picker-title">选择版本</h2>
                <span>VERSIONS</span>
            </div>
            <div class="backup-version-tabs" id="version-tabs" role="tablist" aria-label="三国霸业版本"></div>
        </section>

        <section class="game-section" id="save-panel" role="tabpanel" aria-labelledby="version-tab-SGBY">
            <div class="section-heading">
                <h2>存档槽</h2>
                <span>3 SLOTS</span>
            </div>
            <p class="backup-slot-help">每个槽位可单独下载备份，或从 .json 文件直接还原。</p>
            <div class="backup-slot-grid" id="save-slot-grid" aria-live="polite"></div>
            <input type="file" id="restore-file" class="sr-only"
                   accept=".json,application/json" onchange="onFilePicked(this)">
        </section>

        <footer class="device-footer utility-footer">
            <span id="portal-no-footer">GAME</span>
            <a class="footer-link" href="../index.html">‹ 返回游戏中心</a>
        </footer>
    </main>

    <noscript>
        <p class="noscript-note">备份/还原需要 JavaScript 才能读写存档文件。<a href="../index.html">返回游戏中心</a></p>
    </noscript>
</body>
</html>
