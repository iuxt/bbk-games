<!doctype html>
<html lang="zh-CN" class="gameplay-page">
<head>
    <meta charset="utf-8">

    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://bbk-games.zahui.fan/rpg/">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="步步高电子词典游戏合集">
    <meta property="og:title" content="伏魔记·仙剑·金庸群侠传 — 步步高电子词典 RPG 游戏合集">
    <meta property="og:description" content="140+ 款步步高经典 RPG：伏魔记、仙剑、金庸群侠传等，支持导入 .gam/.lib，浏览器直接玩。">
    <meta property="og:url" content="https://bbk-games.zahui.fan/rpg/">
    <meta property="og:image" content="https://bbk-games.zahui.fan/favicon.png">
    <meta property="og:locale" content="zh_CN">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="步步高电子词典 RPG 游戏合集">
    <meta name="twitter:description" content="伏魔记、仙剑、金庸群侠传等 140+ 款经典 RPG，打开即玩。">
    <meta name="twitter:image" content="https://bbk-games.zahui.fan/favicon.png">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "步步高电子词典 RPG 游戏合集",
      "url": "https://bbk-games.zahui.fan/rpg/",
      "genre": "RPG",
      "gamePlatform": "步步高电子词典",
      "description": "伏魔记、仙剑、金庸群侠传等 140 余款经典 RPG 合集"
    }
    </script>
    <link rel="icon" href="../favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="../css/portal.css?v=2">
    <link rel="stylesheet" href="app.css?v=8">
    <script src="../js/game-page.js?v=1"></script>
</head>
<body>
    <main class="device-shell utility-shell">
        <header class="device-header">
            <a class="brand" href="../index.html" aria-label="返回 BBK 经典游戏首页">
                <span class="brand-mark">BBK</span>
                <span>经典游戏</span>
            </a>
            <span class="power-light" aria-hidden="true"></span>
        </header>

        <div class="section-heading game-title">
            <h1 id="current-game-name">RPG游戏</h1>
            <span>RPG · SIMULATOR · 160×96</span>
        </div>

        <section class="lcd-panel lcd-panel-screen simulator-screen" aria-label="RPG游戏画面">
            <canvas id="canvas" width="160" height="96">你的浏览器不支持 HTML5</canvas>
            <span id="screen-status" class="screen-status" role="status">游戏加载中…</span>
        </section>

        <section id="desktop-controls" class="game-section desktop-controls" aria-labelledby="keys-title">
            <div class="section-heading">
                <h2 id="keys-title">按键映射</h2>
                <span>KEYBOARD</span>
            </div>
            <div class="key-map">
                <div class="key-map-item">
                    <span class="key-chip">↑ ↓ ← →</span>
                    <span>移动 / 选择</span>
                </div>
                <div class="key-map-item">
                    <span class="key-chip">Enter</span>
                    <span>确认 / 输入</span>
                </div>
                <div class="key-map-item">
                    <span class="key-chip">Space / Esc</span>
                    <span>取消 / 返回</span>
                </div>
                <div class="key-map-item">
                    <span class="key-chip">[ ]</span>
                    <span>翻页</span>
                </div>
                <div class="key-map-item">
                    <span class="key-chip">R</span>
                    <span>战斗中重复上次行动</span>
                </div>
            </div>
        </section>

        <div id="touchpad" aria-label="游戏触控按键">
            <div class="kb-row">
                <button id="5" class="btn" type="button" aria-label="向上翻页">PgUp</button>
                <button id="1" class="btn" type="button" aria-label="方向上">↑</button>
                <button id="6" class="btn" type="button" aria-label="向下翻页">PgDn</button>
            </div>
            <div class="kb-row">
                <button id="3" class="btn" type="button" aria-label="方向左">←</button>
                <button id="2" class="btn" type="button" aria-label="方向下">↓</button>
                <button id="4" class="btn" type="button" aria-label="方向右">→</button>
            </div>
            <div class="kb-row">
                <button id="8" class="btn" type="button">取消</button>
                <button id="9" class="btn" type="button" aria-label="重复上次行动">R</button>
                <button id="7" class="btn enter" type="button">确认</button>
            </div>
        </div>

        <footer class="device-footer utility-footer">
            <span>GAME 02 · SIMULATOR</span>
            <nav class="footer-actions" aria-label="模拟器辅助功能">
                <button id="game-picker-open" class="footer-action" type="button"
                        aria-haspopup="dialog" aria-controls="game-picker" aria-expanded="false">
                    选择游戏
                </button>
                <button id="save-manager-open" class="footer-action" type="button"
                        aria-haspopup="dialog" aria-controls="save-manager" aria-expanded="false"
                        disabled>
                    存档管理
                </button>
                <a class="footer-link" href="../index.html">‹ 返回游戏中心</a>
            </nav>
        </footer>
    </main>

    <div id="game-picker" class="dialog-overlay game-picker-overlay" hidden>
        <section class="game-picker-dialog" role="dialog" aria-modal="true" tabindex="-1"
                 aria-labelledby="game-picker-title">
            <header class="lcd-panel game-picker-display">
                <p class="lcd-kicker">ROM COLLECTION / 游戏合集</p>
                <h2 id="game-picker-title">选择游戏<span aria-hidden="true">_</span></h2>
                <p id="game-count" class="lcd-help">正在读取游戏目录…</p>
            </header>

            <label class="game-search">
                <span class="sr-only">搜索游戏</span>
                <input id="game-search" type="search" placeholder="搜索游戏名称" autocomplete="off">
            </label>

            <div id="game-list" class="rom-list" aria-live="polite">
                <p class="loading-card">正在读取游戏目录…</p>
            </div>

            <p id="game-picker-error" class="dialog-error" role="alert" hidden></p>

            <footer class="game-picker-actions">
                <label class="device-button import-button" for="rom-input">
                    导入 .lib / .gam
                </label>
                <input id="rom-input" class="sr-only" type="file" accept=".lib,.gam">
                <button id="game-picker-close" class="device-button" type="button">取消</button>
                <button id="game-picker-use" class="device-button primary-button" type="button" disabled>
                    使用
                </button>
            </footer>

            <div id="game-picker-busy" class="dialog-busy" role="status" hidden>
                <span>游戏载入中…</span>
            </div>
        </section>
    </div>

    <div id="save-manager" class="dialog-overlay save-manager-overlay" hidden>
        <section class="save-manager-dialog" role="dialog" aria-modal="true"
                 aria-labelledby="save-manager-title">
            <header class="lcd-panel game-picker-display">
                <p class="lcd-kicker">CURRENT GAME / 当前游戏</p>
                <h2 id="save-manager-title">存档管理<span aria-hidden="true">_</span></h2>
                <p id="save-game-name" class="lcd-help">尚未选择游戏</p>
            </header>

            <p class="save-manager-help">选择槽位导出备份，或把备份导入到对应槽位。</p>

            <div id="save-slot-list" class="save-slot-list" aria-live="polite"></div>

            <p id="save-manager-error" class="dialog-error" role="alert" hidden></p>
            <p id="save-manager-status" class="dialog-status" role="status" hidden></p>

            <footer class="save-manager-actions">
                <button id="save-manager-close" class="device-button" type="button">完成</button>
            </footer>

            <input id="save-input" class="sr-only" type="file"
                   accept=".json,application/json">
        </section>
    </div>

    <noscript>
        <p class="noscript-note">模拟器需要启用 JavaScript。<a href="../index.html">返回游戏中心</a></p>
    </noscript>

    <script src="srs-anchor.js?v=1"></script>
    <script src="app.js?v=9"></script>
</body>
</html>
