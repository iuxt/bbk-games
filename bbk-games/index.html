<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="/bbk-games/favicon.ico" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using create-react-app" />
    <link rel="apple-touch-icon" href="/bbk-games/logo192.png" />
    <link rel="manifest" href="/bbk-games/manifest.json" />
    <title>步步高电子词典eebbk</title>
    <script
        src="/bbk-games/static/js/react.production.min.js"></script>
    <script
        src="/bbk-games/static/js/react-dom.production.min.js"></script>

    <script defer="defer" src="/bbk-games/static/js/main.c882a77f.js"></script>
    <link href="/bbk-games/static/css/main.49cd0240.css" rel="stylesheet">
    <style>
        /* 禁用移动端点击按钮时的默认矩形高亮（按钮自身的 :active 反馈不受影响） */
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>

<body><noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
        // 隐藏未开发的功能入口：点击只会弹出"开发中 / 暂无 app"提示，没有实际功能。
        // 这些按钮与有效按钮共用同一 class，无法用 CSS 区分，故按文字精准隐藏，
        // 并用 MutationObserver 在每次弹窗/工具栏渲染后持续生效。
        (function () {
            var HIDE = { "金手指（作弊工具）": 1, "切换横屏": 1, "下载APP": 1 };
            function clean() {
                var nodes = document.querySelectorAll("div,span,button,a,li");
                for (var i = 0; i < nodes.length; i++) {
                    var el = nodes[i];
                    if (el.dataset.bbkChecked) continue;
                    el.dataset.bbkChecked = "1";
                    if (el.children.length) continue; // 只匹配文字直接所在的叶子节点
                    var t = el.textContent && el.textContent.trim();
                    if (t && HIDE[t]) el.style.display = "none";
                }
            }
            function start() {
                clean();
                new MutationObserver(clean).observe(document.body, { childList: true, subtree: true });
            }
            if (document.body) start();
            else document.addEventListener("DOMContentLoaded", start);
        })();
    </script>
</body>

</html>
