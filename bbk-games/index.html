<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="/bbk-games/favicon.ico" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#dfe3d1" />
    <meta name="description" content="步步高电子词典经典游戏模拟器与 ROM 合集" />
    <link rel="apple-touch-icon" href="/bbk-games/logo192.png" />
    <link rel="manifest" href="/bbk-games/manifest.json" />
    <title>电子词典游戏 · BBK 经典游戏</title>
    <script
        src="/bbk-games/static/js/react.production.min.js"></script>
    <script
        src="/bbk-games/static/js/react-dom.production.min.js"></script>

    <script defer="defer" src="/bbk-games/static/js/main.c882a77f.js"></script>
    <link href="/bbk-games/static/css/main.49cd0240.css" rel="stylesheet">
    <link href="/bbk-games/ui.css" rel="stylesheet">
    <style>
        /* 禁用移动端点击按钮时的默认矩形高亮（按钮自身的 :active 反馈不受影响） */
        * { -webkit-tap-highlight-color: transparent; }

        /* 修复十字方向键点击区与背景图偏差：
           原 CSS 四臂按钮是 14vw 小正方形、只覆盖“臂根”，且左/上臂缺锚定会漂移，
           导致点击有效区与视觉十字臂错位。此处按背景图臂的真实比例用百分比
           重新定位（相对 .src_cross 容器，大小屏一套规则通吃），点击区精确覆盖整臂。 */
        .src_crossUp__pNTAw { left: 25%; top: 7.5%; width: 50%; height: 30%; }
        .src_crossDown__xzhzA { left: 25%; top: 62.5%; width: 50%; height: 30%; bottom: auto; }
        .src_crossLeft__hGGg\+ { left: 7.5%; top: 25%; width: 30%; height: 50%; }
        .src_crossRight__x8\+eL { left: 62.5%; top: 25%; width: 30%; height: 50%; right: auto; }
    </style>
</head>

<body>
    <main class="simulator-shell">
        <header class="simulator-header">
            <a class="simulator-brand" href="../index.html" aria-label="返回 BBK 经典游戏首页">
                <span class="simulator-brand-mark">BBK</span>
                <span>经典游戏</span>
            </a>
            <span class="simulator-power">
                <i aria-hidden="true"></i>
                SIMULATOR 02
            </span>
        </header>

        <section class="simulator-titlebar" aria-labelledby="simulator-title">
            <div>
                <p>GAME 02 / ROM COLLECTION</p>
                <h1 id="simulator-title">电子词典游戏</h1>
            </div>
            <span>160 × 96</span>
        </section>

        <div id="root" class="simulator-root"></div>

        <footer class="simulator-footer">
            <span>方向键移动 · A 确认 · B 返回</span>
            <a href="../index.html">‹ 返回游戏中心</a>
        </footer>
    </main>

    <noscript>
        <p class="simulator-noscript">模拟器需要启用 JavaScript。<a href="../index.html">返回游戏中心</a></p>
    </noscript>
    <script defer src="/bbk-games/ui.js"></script>
</body>

</html>
